<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Financiera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .number-display {
            font-family: 'Space Grotesk', monospace;
        }
        
        .tab-active {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
        }
        
        .tab-inactive {
            background: transparent;
            color: #6b7280;
        }
        
        .card-gradient-business {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }
        
        .card-gradient-warning {
            background: linear-gradient(135deg, #f97316, #fb923c);
        }
        
        .card-gradient-success {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }
        
        .slide-enter {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <!-- App Container -->
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white shadow-sm border-b sticky top-0 z-10">
            <div class="px-4 py-4">
                <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Gestión Financiera
                </h1>
            </div>
            
            <!-- Tab Navigation -->
            <div class="flex border-t">
                <button onclick="switchTab('calculator')" id="tab-calculator" class="flex-1 py-4 text-center font-semibold transition-all tab-active">
                    <svg class="w-5 h-5 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    Calculadora
                </button>
                <button onclick="switchTab('progress')" id="tab-progress" class="flex-1 py-4 text-center font-semibold transition-all tab-inactive">
                    <svg class="w-5 h-5 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    Progreso
                </button>
            </div>
        </div>

        <!-- CALCULATOR TAB -->
        <div id="view-calculator" class="p-4 space-y-6">
            <!-- Mode Toggle -->
            <div class="bg-white rounded-xl shadow-md p-2">
                <div class="flex gap-2">
                    <button onclick="setMode('business')" id="mode-business" class="flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-lg font-semibold transition-all tab-active">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                        Negocio
                    </button>
                    <button onclick="setMode('personal')" id="mode-personal" class="flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-lg font-semibold transition-all tab-inactive">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Personal
                    </button>
                </div>
            </div>

            <!-- Input Card -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="mb-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-2" id="input-title">Ingreso de Venta Bruta</h2>
                    <label class="block text-sm font-medium text-gray-600 mb-2" id="input-label">Monto de Venta Bruta</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl font-bold text-gray-400">$</span>
                        <input type="number" id="amount-input" placeholder="0.00" step="0.01" min="0" 
                               class="w-full pl-10 pr-4 py-4 text-xl font-semibold rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all">
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="calculateAndSave()" class="flex-1 btn-primary text-white font-semibold py-4 rounded-lg flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Registrar y Guardar
                    </button>
                    <button onclick="resetCalculator()" class="px-6 py-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Results Container -->
            <div id="results-container" class="space-y-4 hidden">
                <!-- Results will be inserted here -->
            </div>

            <!-- Info Banner -->
            <div id="info-banner" class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                <div class="flex items-start gap-3 text-sm text-blue-900">
                    <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p id="info-text">En modo Negocio, el 70% se destina a reinversión/operación y el 30% se transfiere a tu cuenta personal.</p>
                </div>
            </div>
        </div>

        <!-- PROGRESS TAB -->
        <div id="view-progress" class="p-4 space-y-6 hidden">
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Total Debt Paid -->
                <div class="card-gradient-warning rounded-xl shadow-lg p-6 text-white">
                    <div class="flex items-center gap-2 mb-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                        </svg>
                        <span class="text-sm font-semibold opacity-95">Total Pagado a Deudas</span>
                    </div>
                    <p class="text-4xl font-bold number-display mb-1" id="total-debt">$0.00</p>
                    <p class="text-xs opacity-80">Acumulado histórico</p>
                </div>

                <!-- Total Saved -->
                <div class="card-gradient-success rounded-xl shadow-lg p-6 text-white">
                    <div class="flex items-center gap-2 mb-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span class="text-sm font-semibold opacity-95">Total Ahorrado/Inversión</span>
                    </div>
                    <p class="text-4xl font-bold number-display mb-1" id="total-savings">$0.00</p>
                    <p class="text-xs opacity-80">Acumulado histórico</p>
                </div>
            </div>

            <!-- Chart -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Evolución Financiera</h3>
                <div class="relative h-64">
                    <canvas id="financial-chart"></canvas>
                </div>
            </div>

            <!-- Recent History -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-800">Historial Reciente</h3>
                    <button onclick="confirmClearData()" class="text-sm text-red-600 hover:text-red-700 font-medium flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                        Borrar Datos
                    </button>
                </div>
                <div id="history-list" class="space-y-3">
                    <!-- History items will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global State
        let currentMode = 'business';
        let currentTab = 'calculator';
        let chart = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadProgressData();
        });

        // Tab Switching
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.getElementById('tab-calculator').className = tab === 'calculator' 
                ? 'flex-1 py-4 text-center font-semibold transition-all tab-active'
                : 'flex-1 py-4 text-center font-semibold transition-all tab-inactive';
            document.getElementById('tab-progress').className = tab === 'progress' 
                ? 'flex-1 py-4 text-center font-semibold transition-all tab-active'
                : 'flex-1 py-4 text-center font-semibold transition-all tab-inactive';
            
            // Show/hide views
            document.getElementById('view-calculator').classList.toggle('hidden', tab !== 'calculator');
            document.getElementById('view-progress').classList.toggle('hidden', tab !== 'progress');
            
            if (tab === 'progress') {
                loadProgressData();
                renderChart();
            }
        }

        // Mode Switching
        function setMode(mode) {
            currentMode = mode;
            
            // Update mode buttons
            document.getElementById('mode-business').className = mode === 'business'
                ? 'flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-lg font-semibold transition-all tab-active'
                : 'flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-lg font-semibold transition-all tab-inactive';
            document.getElementById('mode-personal').className = mode === 'personal'
                ? 'flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-lg font-semibold transition-all tab-active'
                : 'flex-1 flex items-center justify-center gap-2 px-6 py-4 rounded-lg font-semibold transition-all tab-inactive';
            
            // Update labels
            if (mode === 'business') {
                document.getElementById('input-title').textContent = 'Ingreso de Venta Bruta';
                document.getElementById('input-label').textContent = 'Monto de Venta Bruta';
                document.getElementById('info-text').textContent = 'En modo Negocio, el 70% se destina a reinversión/operación y el 30% se transfiere a tu cuenta personal.';
            } else {
                document.getElementById('input-title').textContent = 'Ingreso Recibido';
                document.getElementById('input-label').textContent = 'Ingreso Recibido';
                document.getElementById('info-text').textContent = 'En modo Personal, se calculan impuestos, diezmo (Maser), y se distribuye el remanente entre casa, ataque a deudas e inversión.';
            }
            
            // Reset calculator
            resetCalculator();
        }

        // Calculate and Save
        function calculateAndSave() {
            const amountInput = document.getElementById('amount-input');
            const amount = parseFloat(amountInput.value);
            
            if (!amount || amount <= 0) {
                alert('Por favor ingresa un monto válido');
                return;
            }
            
            if (currentMode === 'business') {
                calculateBusiness(amount);
                saveBusinessRecord(amount);
            } else {
                calculatePersonal(amount);
                savePersonalRecord(amount);
            }
            
            // Show success message
            showSuccessMessage();
        }

        // Business Calculations
        function calculateBusiness(amount) {
            const reinvestment = amount * 0.70;
            const personalTransfer = amount * 0.30;
            
            const resultsHTML = `
                <div class="slide-enter">
                    <!-- Total -->
                    <div class="bg-blue-50 border-2 border-blue-200 rounded-xl p-6 text-center">
                        <p class="text-sm font-medium text-blue-600 mb-2 uppercase tracking-wide">Total Ingreso</p>
                        <p class="text-4xl font-bold number-display text-blue-600">${formatCurrency(amount)}</p>
                    </div>

                    <!-- Reinvestment -->
                    <div class="card-gradient-business text-white rounded-xl p-6 shadow-lg">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                </svg>
                                Para el Negocio
                            </h3>
                            <span class="text-xs bg-white/20 px-2 py-1 rounded-full font-semibold">70%</span>
                        </div>
                        <p class="text-sm text-blue-100 mb-1">Reinversión / Costos</p>
                        <p class="text-3xl font-bold number-display">${formatCurrency(reinvestment)}</p>
                        <p class="text-xs text-blue-100 mt-2">Este monto permanece en tu negocio</p>
                    </div>

                    <!-- Personal Transfer -->
                    <div class="bg-white border-2 border-gray-200 rounded-xl p-6 shadow-md">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                Transferir a Mi Cuenta
                            </h3>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-semibold">30%</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-1">Mi Sueldo</p>
                        <p class="text-3xl font-bold number-display text-gray-800">${formatCurrency(personalTransfer)}</p>
                    </div>

                    <!-- Alert -->
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                        <div class="flex items-start gap-3 text-sm text-blue-900">
                            <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                            </svg>
                            <div>
                                <strong class="font-semibold">Próximo paso:</strong> Usa el monto de ${formatCurrency(personalTransfer)} como ingreso en el <strong>Modo Personal</strong>.
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            showResults(resultsHTML);
        }

        // Personal Calculations
        function calculatePersonal(amount) {
            const taxes = amount * 0.15;
            const netReal = amount - taxes;
            const maser = netReal * 0.10;
            const remainder = netReal - maser;
            const house = remainder * 0.60;
            const debts = remainder * 0.30;
            const investment = remainder * 0.10;
            
            const resultsHTML = `
                <div class="slide-enter space-y-4">
                    <!-- Total -->
                    <div class="bg-white border-2 border-gray-200 rounded-xl p-6 text-center">
                        <p class="text-sm font-medium text-gray-600 mb-2 uppercase tracking-wide">Ingreso Total Recibido</p>
                        <p class="text-4xl font-bold number-display text-gray-800">${formatCurrency(amount)}</p>
                    </div>

                    <!-- Taxes -->
                    <div class="bg-white border-l-4 border-l-red-500 rounded-xl p-6 shadow-md">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
                                <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                Paso 1: Impuestos
                            </h3>
                            <span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded-full font-semibold">15%</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-1">Apartar para SRI / IVA</p>
                        <p class="text-2xl font-bold number-display text-red-600">${formatCurrency(taxes)}</p>
                    </div>

                    <!-- Flow -->
                    <div class="flex items-center justify-center py-2">
                        <div class="flex items-center gap-2 text-sm text-gray-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                            <span class="font-medium">Neto Real: ${formatCurrency(netReal)}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Maser -->
                    <div class="bg-white border-l-4 border-l-blue-500 rounded-xl p-6 shadow-md">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                Paso 3: Maser (Dar)
                            </h3>
                            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-semibold">10% del Neto</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-1">10% sobre ${formatCurrency(netReal)}</p>
                        <p class="text-2xl font-bold number-display text-blue-600">${formatCurrency(maser)}</p>
                    </div>

                    <!-- Flow -->
                    <div class="flex items-center justify-center py-2">
                        <div class="flex items-center gap-2 text-sm text-gray-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                            <span class="font-medium">Remanente: ${formatCurrency(remainder)}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Distribution Title -->
                    <div class="pt-2">
                        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                            </svg>
                            Paso 5: Distribución Final
                        </h3>
                        <p class="text-sm text-gray-600 mt-1">Del remanente de ${formatCurrency(remainder)}</p>
                    </div>

                    <!-- House -->
                    <div class="bg-white border-l-4 border-l-gray-700 rounded-xl p-6 shadow-md">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                                </svg>
                                Casa / Vivir
                            </h3>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-semibold">60%</span>
                        </div>
                        <p class="text-3xl font-bold number-display text-gray-800">${formatCurrency(house)}</p>
                        <p class="text-xs text-gray-600 mt-2">Para gastos de vivienda y necesidades básicas</p>
                    </div>

                    <!-- Debts -->
                    <div class="card-gradient-warning text-white rounded-xl p-6 shadow-lg">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                                </svg>
                                Ataque a Deudas
                            </h3>
                            <span class="text-xs bg-white/20 px-2 py-1 rounded-full font-semibold">30%</span>
                        </div>
                        <p class="text-3xl font-bold number-display">${formatCurrency(debts)}</p>
                        <p class="text-xs mt-2 opacity-90">⚠️ Prioridad: Pagar y reducir deudas activas</p>
                    </div>

                    <!-- Investment -->
                    <div class="card-gradient-success text-white rounded-xl p-6 shadow-lg">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-semibold flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                Semilla / Inversión
                            </h3>
                            <span class="text-xs bg-white/20 px-2 py-1 rounded-full font-semibold">10%</span>
                        </div>
                        <p class="text-3xl font-bold number-display">${formatCurrency(investment)}</p>
                        <p class="text-xs mt-2 opacity-90">🌱 Para ahorro e inversiones a futuro</p>
                    </div>
                </div>
            `;
            
            showResults(resultsHTML);
        }

        // Show Results
        function showResults(html) {
            const container = document.getElementById('results-container');
            container.innerHTML = html;
            container.classList.remove('hidden');
            document.getElementById('info-banner').classList.add('hidden');
        }

        // Reset Calculator
        function resetCalculator() {
            document.getElementById('amount-input').value = '';
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('info-banner').classList.remove('hidden');
        }

        // Save Business Record
        function saveBusinessRecord(amount) {
            const records = getRecords();
            const record = {
                date: new Date().toISOString(),
                type: 'business',
                amount: amount,
                personalTransfer: amount * 0.30,
                debts: 0,
                savings: 0
            };
            records.push(record);
            localStorage.setItem('financialRecords', JSON.stringify(records));
        }

        // Save Personal Record
        function savePersonalRecord(amount) {
            const records = getRecords();
            const taxes = amount * 0.15;
            const netReal = amount - taxes;
            const maser = netReal * 0.10;
            const remainder = netReal - maser;
            const debts = remainder * 0.30;
            const savings = remainder * 0.10;
            
            const record = {
                date: new Date().toISOString(),
                type: 'personal',
                amount: amount,
                personalTransfer: 0,
                debts: debts,
                savings: savings
            };
            records.push(record);
            localStorage.setItem('financialRecords', JSON.stringify(records));
        }

        // Get Records
        function getRecords() {
            const data = localStorage.getItem('financialRecords');
            return data ? JSON.parse(data) : [];
        }

        // Load Progress Data
        function loadProgressData() {
            const records = getRecords();
            
            // Calculate totals
            let totalDebt = 0;
            let totalSavings = 0;
            
            records.forEach(record => {
                totalDebt += record.debts || 0;
                totalSavings += record.savings || 0;
            });
            
            document.getElementById('total-debt').textContent = formatCurrency(totalDebt);
            document.getElementById('total-savings').textContent = formatCurrency(totalSavings);
            
            // Render history
            renderHistory(records);
        }

        // Render History
        function renderHistory(records) {
            const container = document.getElementById('history-list');
            
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <svg class="w-12 h-12 mx-auto mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>No hay registros aún</p>
                        <p class="text-sm mt-1">Comienza registrando tus ingresos en la Calculadora</p>
                    </div>
                `;
                return;
            }
            
            // Show last 10 records
            const recentRecords = records.slice(-10).reverse();
            
            container.innerHTML = recentRecords.map(record => {
                const date = new Date(record.date);
                const dateStr = date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
                const timeStr = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-all">
                        <div class="flex items-center gap-3">
                            <div class="${record.type === 'business' ? 'bg-blue-500' : 'bg-gray-700'} text-white w-10 h-10 rounded-lg flex items-center justify-center">
                                ${record.type === 'business' 
                                    ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>'
                                    : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>'}
                            </div>
                            <div>
                                <p class="font-semibold text-gray-800">${record.type === 'business' ? 'Negocio' : 'Personal'}</p>
                                <p class="text-xs text-gray-500">${dateStr} • ${timeStr}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-gray-800 number-display">${formatCurrency(record.amount)}</p>
                            ${record.debts > 0 ? `<p class="text-xs text-orange-600">Deuda: ${formatCurrency(record.debts)}</p>` : ''}
                            ${record.savings > 0 ? `<p class="text-xs text-green-600">Ahorro: ${formatCurrency(record.savings)}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Chart
        function renderChart() {
            const records = getRecords();
            
            if (records.length === 0) return;
            
            // Prepare data - aggregate by date
            const dataByDate = {};
            records.forEach(record => {
                const date = new Date(record.date).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
                if (!dataByDate[date]) {
                    dataByDate[date] = { debts: 0, savings: 0 };
                }
                dataByDate[date].debts += record.debts || 0;
                dataByDate[date].savings += record.savings || 0;
            });
            
            const labels = Object.keys(dataByDate);
            const debtsData = labels.map(date => dataByDate[date].debts);
            const savingsData = labels.map(date => dataByDate[date].savings);
            
            const ctx = document.getElementById('financial-chart');
            
            // Destroy existing chart
            if (chart) {
                chart.destroy();
            }
            
            // Create new chart
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Ataque a Deudas',
                            data: debtsData,
                            borderColor: 'rgb(249, 115, 22)',
                            backgroundColor: 'rgba(249, 115, 22, 0.1)',
                            borderWidth: 3,
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'Semilla/Inversión',
                            data: savingsData,
                            borderColor: 'rgb(34, 197, 94)',
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            borderWidth: 3,
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                }
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + formatCurrency(context.parsed.y);
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString('es-EC');
                                }
                            }
                        }
                    }
                }
            });
        }

        // Clear All Data
        function confirmClearData() {
            if (confirm('¿Estás seguro de que quieres borrar todos los datos? Esta acción no se puede deshacer.')) {
                localStorage.removeItem('financialRecords');
                loadProgressData();
                if (chart) {
                    chart.destroy();
                    chart = null;
                }
                alert('Datos borrados exitosamente');
            }
        }

        // Show Success Message
        function showSuccessMessage() {
            const message = document.createElement('div');
            message.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-4 rounded-lg shadow-lg flex items-center gap-3 z-50 slide-enter';
            message.innerHTML = `
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold">¡Registro guardado exitosamente!</span>
            `;
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // Format Currency
        function formatCurrency(value) {
            return new Intl.NumberFormat('es-EC', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(value);
        }

        // Enter key support
        document.getElementById('amount-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateAndSave();
            }
        });
    </script>
</body>
</html>
